<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Product Management</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f7f9fc; }
        h2 { color: #333; }
        table { border-collapse: collapse; width: 60%; margin-top: 15px; margin-bottom: 25px; background: #fff; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        th { background-color: #e9ecef; }
        .form-group { margin-bottom: 10px; }
        input { padding: 6px; width: 250px; }
        button { padding: 6px 12px; background: #28a745; color: white; border: none; cursor: pointer; }
        a { color: #dc3545; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <h2>Керування товарами (UI - Критерій 3)</h2>

    <table>
        <tr>
            <th>ID</th>
            <th>Назва</th>
            <th>SKU</th>
            <th>Ціна</th>
            <th>Кількість</th>
            <th>Дія</th>
        </tr>
        <tr th:each="product : ${products}">
            <td th:text="${product.id}"></td>
            <td th:text="${product.name}"></td>
            <td th:text="${product.sku}"></td>
            <td th:text="${product.price}"></td>
            <td th:text="${product.quantity}"></td>
            <td><a th:href="@{/products/delete/{id}(id=${product.id})}">Видалити</a></td>
        </tr>
    </table>

    <h3>Додати новий товар</h3>
    <form th:action="@{/products}" th:object="${newProduct}" method="post">
        <div class="form-group"><input type="text" th:field="*{name}" placeholder="Назва товару" required /></div>
        <div class="form-group"><input type="text" th:field="*{sku}" placeholder="Унікальний SKU" required /></div>
        <div class="form-group"><input type="number" step="0.01" th:field="*{price}" placeholder="Ціна" required /></div>
        <div class="form-group"><input type="number" th:field="*{quantity}" placeholder="Кількість на складі" required /></div>
        <button type="submit">Додати</button>
    </form>
</body>
</html>
